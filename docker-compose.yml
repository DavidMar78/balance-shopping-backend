services:
  postgres:
    image: postgres:16
    container_name: expenses_postgres

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: expenses_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: expenses_backend

    ports:
      - "3001:3001"

    depends_on:
      - postgres

  adminer:
    image: adminer
    container_name: expenses_adminer

    ports:
      - "8080:8080"

volumes:
  postgres_data: